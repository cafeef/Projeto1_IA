[project]
name = "dengue-agent"
version = "0.1.0"
description = "Simulação de agente inteligente para combate à dengue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["arcade>=3.0"]

[project.scripts]
dengue = "dengue_agent.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
