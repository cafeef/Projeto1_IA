[project]
name = "dengue-agent"
version = "0.1.0"
description = "Simulação de agente inteligente para combate à dengue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["arcade>=3.0"]

[project.scripts]
dengue = "dengue_agent.main:main"
dengue-experimentos = "dengue_agent.experiments:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pymupdf>=1.28.2",
    "pytest>=8.0",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
